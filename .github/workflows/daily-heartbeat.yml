name: Daily Bot Heartbeat

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram heartbeat debug
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e

          echo "BOT_TOKEN length: ${#BOT_TOKEN}"
          echo "CHAT_ID length: ${#CHAT_ID}"

          MSG="GitHub heartbeat test - Solana wallet bot is running"

          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -o response.json \
            -w "HTTP_CODE=%{http_code}\n"

          echo "Telegram response:"
          cat response.json
          echo


          grep -q '"ok":true' response.json
