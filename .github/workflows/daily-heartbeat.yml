name: Daily Bot Heartbeat

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram heartbeat
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e

          if [ -z "$BOT_TOKEN" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN"
            exit 1
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "Missing TELEGRAM_CHAT_ID"
            exit 1
          fi

          NOW="$(TZ=Asia/Aden date '+%Y-%m-%d %H:%M:%S')"
          MSG="✅ بوت محفظة سولانا شغال. الفحص يعمل كل 5 دقائق على GitHub. الوقت: ${NOW}"

          curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \

            --data-urlencode "text=${MSG}"
