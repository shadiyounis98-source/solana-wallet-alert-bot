name: Solana Wallet Alert Bot - كل 5 دقائق

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solana-wallet-alert-bot
  cancel-in-progress: false

jobs:
  scan-wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create runtime .env from GitHub Secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID in GitHub Secrets"
            exit 1
          fi

          cat > .env <<EOF
          TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
          TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID
          WATCH_WALLET=5G6nFdugA2D5qGP4zr6b2DzPKwCTuP22gSEAhykWpLF
          RPC_URLS=https://api.mainnet.solana.com,https://api.mainnet-beta.solana.com,https://solana-rpc.publicnode.com
          POLL_SECONDS=0
          SIGNATURE_LIMIT=100
          BOOTSTRAP_SKIP_HISTORY=true
          RUN_ONCE=true
          MAX_CYCLES=1
          AGG_WINDOW_SECONDS=900
          MIN_BUY_COUNT=2
          MIN_TOTAL_BUY_USD=50
          MAX_PRICE_ABOVE_ENTRY_PCT=25
          MAX_PRICE_BELOW_ENTRY_PCT=-25
          MAX_SELL_PCT_FOR_PASS=25
          MIN_LIQUIDITY_USD=2000
          PREFERRED_LIQUIDITY_USD=10000
          MIN_BUYS_5M=3
          MIN_VOLUME_5M_USD=0
          REQUIRE_RUGCHECK_FOR_PASS=false
          SEND_WATCH=false
          SEND_NO_ENTRY=false
          POSITION_SIZE_NORMAL_PCT=0.5
          POSITION_SIZE_STRONG_PCT=1.0
          STOP_LOSS_PCT=30
          HARD_STOP_LOSS_PCT=35
          TP1_PCT=50
          TP2_PCT=100
          TP3_MIN_PCT=150
          TP3_MAX_PCT=200
          TRAILING_STOP_MIN_PCT=25
          TRAILING_STOP_MAX_PCT=35
          EOF

          sed -i 's/^          //' .env

      - name: Run one wallet scan
        run: |
          python bot.py

      - name: Commit updated bot state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f state.json ]; then
            git add state.json
          else
            echo "No state.json found."
          fi

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(wallet): update bot state [skip ci]"
            git push

          fi
